<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Portfolio Generator</title>
    <style>
        .loader {
    border: 4px solid rgba(255, 255, 255, 0.1);
    border-top: 4px solid var(--primary);
    border-radius: 50%;
    width: 45px;
    height: 45px;
    animation: spin 1s linear infinite;
    margin: 0 auto 15px auto;
    box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
}
@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #38bdf8;
            --text-main: #f8fafc;
            --border: #334155;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid var(--border);
            width: 100%;
            max-width: 600px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }
        h1 {
            color: var(--primary);
            margin-bottom: 10px;
        }
        p {
            color: #94a3b8;
            margin-bottom: 25px;
        }
        input[type="file"] {
            display: block;
            width: 100%;
            margin-bottom: 20px;
            padding: 15px;
            background-color: #0f172a;
            border: 1px dashed var(--primary);
            border-radius: 8px;
            color: var(--text-main);
            box-sizing: border-box;
            cursor: pointer;
        }
        button {
            width: 100%;
            background-color: var(--primary);
            color: #0f172a;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #7dd3fc;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>AI Portfolio Builder</h1>
        <p>Upload your plain-text <b>resume.txt</b> file to generate your portfolio.</p>
        
        <!-- This form accepts a .txt file upload and sends it to your Python app -->
        <form action="/" method="POST" enctype="multipart/form-data">
            <input type="file" name="resume_file" accept=".txt" required>
            <button type="submit">Generate Portfolio</button>
        </form>
        <div id="loading-screen" style="display: none; margin-top: 20px;">
    <div class="loader"></div>
    <p style="color: var(--primary);">Applying AI magic... parsing your resume!</p>
</div>
    </div>
    <script>
    const form = document.querySelector('form');
    const loadingScreen = document.getElementById('loading-screen');

    form.addEventListener('submit', () => {
        form.style.display = 'none';
        loadingScreen.style.display = 'block';
    });
</script>

</body>
</html>
