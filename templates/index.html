<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Portfolio Generator</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #38bdf8;
            --text-main: #f8fafc;
            --border: #334155;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid var(--border);
            width: 100%;
            max-width: 600px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }
        h1 {
            color: var(--primary);
            margin-bottom: 10px;
        }
        p {
            color: #94a3b8;
            margin-bottom: 25px;
        }
        input[type="file"] {
            display: block;
            width: 100%;
            margin-bottom: 20px;
            padding: 15px;
            background-color: #0f172a;
            border: 1px dashed var(--primary);
            border-radius: 8px;
            color: var(--text-main);
            box-sizing: border-box;
            cursor: pointer;
        }
        button {
            width: 100%;
            background-color: var(--primary);
            color: #0f172a;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #7dd3fc;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>AI Portfolio Builder</h1>
        <p>Upload your plain-text <b>resume.txt</b> file to generate your portfolio.</p>
        
        <!-- This form accepts a .txt file upload and sends it to your Python app -->
        <form action="/" method="POST" enctype="multipart/form-data">
            <input type="file" name="resume_file" accept=".txt" required>
            <button type="submit">Generate Portfolio</button>
        </form>
    </div>

</body>
</html>
